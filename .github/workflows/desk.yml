# The proofreading desk (tools/desk.py, tools/desk.html), on GitHub Pages.
#
# A person presses Send at their desk: it commits desk/send.json to their
# branch, which runs this.  Their saved pages (desk/inbox/) go into the book
# (`desk.py apply`), committed to their branch; then every person's desk is
# rebuilt with their next pages and published.  Run it by hand (Actions ->
# Proofreading desk -> Run workflow) to rebuild the desks without a send.
name: Proofreading desk

on:
  push:
    paths: ["desk/send.json"]
  workflow_dispatch:

# one at a time: two sends never write the same branch at once
concurrency:
  group: desk
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  desk:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: century
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ahaspel/wikikit
          path: wikikit
      - uses: astral-sh/setup-uv@v5
      - name: Scans already fetched
        uses: actions/cache@v4
        with:
          path: century/data/scans
          key: scans-${{ github.run_id }}
          restore-keys: scans-

      - name: Install
        working-directory: century
        run: uv sync --frozen

      # Every branch with a send waiting, whatever started this run: a send
      # whose own run never came (the workflow not yet on its branch) is
      # taken up by the next.
      - name: Apply the sent pages
        working-directory: century
        run: |
          set -euo pipefail
          git config user.name "Century desk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the desk's own tools from master, whatever a branch carries
          git show origin/master:tools/desk.py > "$RUNNER_TEMP/desk.py"
          git show origin/master:tools/desk.html > "$RUNNER_TEMP/desk.html"
          git show origin/master:desk/people.json > "$RUNNER_TEMP/people.json"
          echo '{}' > "$RUNNER_TEMP/sends.json"
          for branch in $(jq -r '.[]' "$RUNNER_TEMP/people.json"); do
            git switch -q --discard-changes -C "$branch" "origin/$branch"
            [ -f desk/send.json ] || continue
            id=$(jq -r .id desk/send.json)
            who=$(jq -r '.by // "the desk"' desk/send.json)
            n=0
            if ls desk/inbox/*.json >/dev/null 2>&1; then
              n=$(ls desk/inbox/*.json | wc -l)
              uv run --frozen python "$RUNNER_TEMP/desk.py" apply desk/inbox
              git rm -rq desk/inbox
            fi
            git rm -q desk/send.json
            git add data/supplied
            git commit -q -m "Proofread at the desk: $n page(s) sent by $who"
            for i in 1 2 3; do
              git push -q origin "HEAD:$branch" && break
              git pull -q --rebase origin "$branch"
            done
            jq --arg b "$branch" --arg id "$id" '.[$b] = $id' "$RUNNER_TEMP/sends.json" > "$RUNNER_TEMP/s" && mv "$RUNNER_TEMP/s" "$RUNNER_TEMP/sends.json"
          done

      - name: Build every desk
        working-directory: century
        run: |
          set -euo pipefail
          git fetch -q origin
          site="$GITHUB_WORKSPACE/site"
          mkdir -p "$site/desk"
          for person in $(jq -r 'keys[]' "$RUNNER_TEMP/people.json"); do
            branch=$(jq -r --arg p "$person" '.[$p]' "$RUNNER_TEMP/people.json")
            git switch -q --discard-changes -C "$branch" "origin/$branch"
            id=$(jq -r --arg b "$branch" '.[$b] // ""' "$RUNNER_TEMP/sends.json")
            uv run --frozen python "$RUNNER_TEMP/desk.py" site "$site/desk/$person" "$person" "$branch" --send-id "$id"
          done
          git switch -q --discard-changes -C master origin/master
          uv run --frozen python "$RUNNER_TEMP/desk.py" index "$site/desk"
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=desk/">' > "$site/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
